<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16668f">
<title>উপস্থিতি খাতা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef5f9;
    --surface: #ffffff;
    --surface-2: #f0f7fb;
    --ink: #0c2733;
    --ink-soft: #4d6d7d;
    --line: #d2e2ec;
    --brand: #16668f;
    --brand-end: #1a86b8;
    --brand-ink: #ffffff;
    --brand-soft: #d6eaf6;
    --band: #16668f;
    --band-end: #1a86b8;
    --band-ink: #eaf9ff;
    --band-soft: rgba(234, 249, 255, .8);
    --good: #0f9d7c;
    --good-soft: #cffbf0;
    --bad: #b3261e;
    --bad-soft: #fbe6e3;
    --warn: #8a5a00;
    --warn-soft: #fdf0d2;
    --accent: #0fdefa;
    --mint: #0ffac8;
    --focus: #0fdefa;
    --shadow: 0 1px 2px rgba(12, 39, 51, .06), 0 6px 18px rgba(12, 39, 51, .06);
    --font: "Hind Siliguri", "Noto Sans Bengali", "Kalpurush", "Nirmala UI", "Vrinda", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #071720;
      --surface: #0e2733;
      --surface-2: #133240;
      --ink: #e3f2f8;
      --ink-soft: #8fb1bf;
      --line: #1d4153;
      --brand: #0fdefa;
      --brand-end: #0f9fdf;
      --brand-ink: #042230;
      --brand-soft: #0e3a4d;
      --band: #0e4a68;
      --band-end: #106d94;
      --band-ink: #e3f6fd;
      --band-soft: rgba(227, 246, 253, .76);
      --good: #0ffac8;
      --good-soft: #0d3d33;
      --bad: #ff8a80;
      --bad-soft: #3a1f1c;
      --warn: #f3c56b;
      --warn-soft: #3b2f12;
      --accent: #0fdefa;
      --mint: #0ffac8;
      --focus: #0ffac8;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  }

  body.noscroll { overflow: hidden; }

  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }

  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .ico { display: inline-grid; place-items: center; line-height: 0; }
  .ico svg { width: 22px; height: 22px; }

  .wrap { max-width: 640px; margin: 0 auto; }

  /* ---------- Topbar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(180deg, var(--band) 0%, var(--band-end) 100%);
    color: var(--band-ink);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-sub { font-size: .74rem; font-weight: 500; opacity: .82; letter-spacing: .01em; }
  .logo { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: rgba(255,255,255,.14); }
  .logo .ico svg { width: 20px; height: 20px; }

  .icon-btn {
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border: 0; border-radius: 12px;
    background: transparent; color: inherit;
  }
  .icon-btn.light { background: rgba(255,255,255,.12); }
  .icon-btn:active { background: rgba(255,255,255,.24); }

  /* ---------- Band (view header) ---------- */
  .band {
    background: linear-gradient(180deg, var(--band) 0%, var(--band-end) 100%);
    color: var(--band-ink);
    padding: 6px 16px 22px;
    border-radius: 0 0 22px 22px;
  }

  .band h1 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 600; color: var(--band-soft); }

  .band .field-label { color: var(--band-soft); }

  .field-label { display: block; font-size: .88rem; font-weight: 500; margin-bottom: 6px; }

  .content { padding: 16px 12px 0; }

  /* ---------- Date bar ---------- */
  .datebar { margin-top: 14px; padding-top: 14px; border-top: 1px dashed rgba(255,255,255,.3); }

  .db-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  .db-step {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border: 1.5px solid rgba(255,255,255,.28);
    border-radius: 12px;
    background: rgba(255,255,255,.1);
    color: var(--band-ink);
  }
  .db-step:active { background: rgba(255,255,255,.22); }
  .db-step:disabled { opacity: .35; cursor: not-allowed; }

  .db-main { flex: 1; text-align: center; display: flex; flex-direction: column; line-height: 1.2; }
  .db-week { font-size: 1rem; font-weight: 500; color: var(--band-soft); }
  .db-date { font-size: 2rem; font-weight: 700; letter-spacing: .01em; font-variant-numeric: tabular-nums; }

  .db-pick {
    margin: 8px auto 0;
    display: flex; align-items: center; gap: 6px;
    min-height: 36px; padding: 0 12px;
    border: 0; border-radius: 999px;
    background: rgba(255,255,255,.12);
    color: var(--band-ink);
    font-size: .9rem; font-weight: 500;
  }
  .db-pick .ico svg { width: 16px; height: 16px; }

  .pick { display: none; margin-top: 8px; }
  .pick.open { display: block; }

  /* ---------- Inputs ---------- */
  .text-input, .sel, .date-input {
    width: 100%;
    min-height: 50px;
    padding: 0 14px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: var(--surface-2);
    color: var(--ink);
    font-size: 1rem;
  }

  .text-input::placeholder { color: var(--ink-soft); opacity: .8; }

  .text-input:focus, .sel:focus, .date-input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-soft);
  }

  .select-wrap { position: relative; min-width: 0; }
  .select-wrap select { appearance: none; -webkit-appearance: none; padding-right: 40px; text-overflow: ellipsis; cursor: pointer; }
  .select-wrap::after {
    content: "";
    position: absolute; right: 16px; top: 50%;
    width: 8px; height: 8px;
    border-right: 2.5px solid var(--ink-soft);
    border-bottom: 2.5px solid var(--ink-soft);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }

  .band .sel, .band .date-input, .band .text-input {
    border-color: rgba(255,255,255,.28);
    background: rgba(255,255,255,.1);
    color: var(--band-ink);
    font-weight: 600;
    color-scheme: dark;
  }
  .band .text-input::placeholder { color: var(--band-soft); }
  .band .select-wrap::after { border-color: var(--band-ink); }
  .band .sel option { color: #0c2733; background: #ffffff; }

  .hint { margin: 6px 0 0; font-size: .82rem; color: var(--ink-soft); }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }

  .tools { display: flex; gap: 8px; align-items: stretch; }
  .tools .select-wrap { flex: 1; }

  .tool-btn {
    flex: 0 0 auto; width: 50px; min-height: 50px;
    display: grid; place-items: center;
    border: 1.5px solid rgba(255,255,255,.28);
    border-radius: 12px;
    background: rgba(255,255,255,.1);
    color: var(--band-ink);
  }
  .tool-btn:active { background: rgba(255,255,255,.22); }
  .tool-btn:disabled { opacity: .4; cursor: not-allowed; }

  .inline-form { display: none; gap: 8px; margin-top: 10px; }
  .inline-form.open { display: flex; }
  .inline-form .text-input { flex: 1; min-width: 0; min-height: 48px; background: rgba(255,255,255,.95); color: #0c2733; }
  .inline-form button { min-height: 48px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--band-ink); color: #16668f; font-weight: 700; }

  .chips { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 2px; }
  .chip {
    flex: 0 0 auto; min-height: 36px; padding: 0 14px;
    border: 1.5px solid rgba(255,255,255,.28);
    border-radius: 999px;
    background: transparent; color: var(--band-ink);
    font-size: .92rem; font-weight: 500;
  }
  .chip.on { background: var(--band-ink); color: #16668f; border-color: var(--band-ink); font-weight: 700; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 14px;
  }

  .section { padding: 18px 16px; }
  .section + .section { border-top: 1px solid var(--line); }

  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .section-head h2 { margin: 0; font-size: 1.1rem; font-weight: 700; }

  .count {
    display: inline-block; margin-left: 6px; padding: 0 9px;
    border-radius: 999px; background: var(--brand-soft); color: var(--brand);
    font-size: .85rem; font-weight: 700; vertical-align: 1px;
  }

  .link-btns { display: flex; gap: 4px; }
  .link-btn { min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--brand); font-weight: 600; font-size: .92rem; }
  .link-btn:active { background: var(--brand-soft); }

  /* ---------- Buttons ---------- */
  .btn {
    min-height: 50px; padding: 0 18px;
    border: 0; border-radius: 12px;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-end) 100%);
    color: var(--brand-ink);
    font-weight: 700; font-size: 1rem;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    white-space: nowrap;
  }
  .btn:active { filter: brightness(.92); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn .ico svg { width: 20px; height: 20px; }
  .btn.block { width: 100%; }
  .btn.ghost { background: var(--surface-2); color: var(--ink); border: 1.5px solid var(--line); }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn.small { min-height: 40px; padding: 0 14px; font-size: .95rem; }

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

  /* ---------- Stats panel ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 18px 16px; margin-bottom: 14px; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .num { display: flex; flex-direction: column; padding: 2px 4px; }
  .num + .num { border-left: 1px solid var(--line); }
  .num b { font-size: 2.1rem; line-height: 1.15; font-weight: 700; font-variant-numeric: tabular-nums; }
  .num span { font-size: .9rem; color: var(--ink-soft); }
  .num.good b { color: var(--good); }
  .num.bad b { color: var(--bad); }

  .bar { height: 10px; margin: 16px 0 14px; border-radius: 999px; background: var(--bad-soft); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--mint) 0%, var(--accent) 100%); border-radius: 999px; transition: width .4s ease; }
  .bar.idle { background: var(--line); }

  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fact { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
  .fact b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .fact span { display: block; font-size: .82rem; color: var(--ink-soft); line-height: 1.35; }

  .note { margin: 12px 0 0; font-size: .85rem; color: var(--ink-soft); }

  .h2 { margin: 22px 4px 10px; font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .h2:first-child { margin-top: 4px; }

  /* ---------- Class list ---------- */
  .plain { list-style: none; margin: 0; padding: 0; }

  .cls {
    width: 100%; text-align: left;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; margin-bottom: 8px;
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface);
  }
  .cls:active { background: var(--surface-2); }
  .cls b { display: block; font-size: 1.05rem; }
  .cls small { display: block; color: var(--ink-soft); font-size: .88rem; }
  .cnt { display: flex; flex-direction: column; align-items: flex-end; font-size: .88rem; font-weight: 600; white-space: nowrap; }
  .cnt .g { color: var(--good); }
  .cnt .r { color: var(--bad); }

  .muted-box { padding: 12px 14px; border: 1.5px dashed var(--line); border-radius: 14px; color: var(--ink-soft); font-size: .92rem; }

  /* ---------- Segmented ---------- */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 10px; }
  .seg button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-soft); font-weight: 600; font-size: .95rem; }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .group-title { margin: 14px 2px 8px; font-size: .9rem; font-weight: 700; color: var(--ink-soft); }
  .group-title.red { color: var(--bad); }

  /* ---------- Absent list ---------- */
  .ab {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 12px; margin-bottom: 8px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  }
  .ab.hot { border-color: var(--bad); background: var(--bad-soft); }
  .ab-main { flex: 1; min-width: 0; }
  .ab-name { font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
  .ab-meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: .85rem; color: var(--ink-soft); }
  .ab-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .ab-actions { display: flex; gap: 6px; }

  .badge { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .82rem; font-weight: 700; white-space: nowrap; }
  .badge.red { background: var(--bad); color: #fff; }
  .badge.amber { background: var(--warn-soft); color: var(--warn); }
  .badge.green { background: var(--good-soft); color: var(--good); }
  .badge.gray { background: var(--surface-2); color: var(--ink-soft); }

  .mini {
    width: 38px; height: 38px; display: grid; place-items: center;
    border-radius: 10px; border: 1.5px solid var(--line);
    background: var(--surface); color: var(--brand); text-decoration: none;
  }
  .mini .ico svg { width: 18px; height: 18px; }
  .mini.wa { color: #128c4a; }
  .mini:active { background: var(--brand-soft); }

  /* ---------- Attendance ticks ---------- */
  .names { list-style: none; margin: 0; padding: 0; }

  .row {
    display: flex; align-items: center; gap: 6px;
    border: 1.5px solid var(--line); border-radius: 12px;
    margin-bottom: 8px; background: var(--surface);
    transition: background-color .15s, border-color .15s;
  }
  .row.on { background: var(--brand-soft); border-color: var(--brand); }

  .check { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 12px; cursor: pointer; position: relative; }
  .check input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }

  .box {
    flex: 0 0 auto; width: 28px; height: 28px;
    border: 2px solid var(--ink-soft); border-radius: 8px;
    display: grid; place-items: center; background: var(--surface);
    transition: background-color .15s, border-color .15s, box-shadow .15s;
  }
  .box svg { width: 18px; height: 18px; stroke: var(--brand-ink); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .18s ease; }
  .check input:checked + .box { background: var(--brand); border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 250, 200, .28); }
  .check input:checked + .box svg { stroke-dashoffset: 0; }
  .check input:focus-visible + .box { outline: 3px solid var(--focus); outline-offset: 2px; }

  .nm { flex: 1; min-width: 0; font-size: 1.05rem; font-weight: 500; overflow-wrap: anywhere; line-height: 1.3; }
  .roll-tag { flex: 0 0 auto; font-size: .82rem; color: var(--ink-soft); font-weight: 600; }

  .empty { padding: 18px 12px; text-align: center; color: var(--ink-soft); border: 1.5px dashed var(--line); border-radius: 12px; font-size: .98rem; }

  .status { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; padding: 10px 12px; border-radius: 12px; font-size: .92rem; font-weight: 500; }
  .status.ok { background: var(--good-soft); color: var(--good); }
  .status.dirty { background: var(--warn-soft); color: var(--warn); }
  .status.new { background: var(--surface-2); color: var(--ink-soft); }

  /* ---------- Numbered lists ---------- */
  .present { list-style: none; margin: 0; padding: 0; counter-reset: n; }
  .present li { counter-increment: n; display: flex; gap: 12px; align-items: baseline; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 1.05rem; font-weight: 500; }
  .present li:last-child { border-bottom: 0; }
  .present li::before { content: counter(n) "."; min-width: 2.2ch; color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; }
  .present.absent li::before { color: var(--bad); }
  .present li .r { margin-left: auto; font-size: .82rem; color: var(--ink-soft); font-weight: 500; }

  .counts { display: flex; gap: 8px; margin-bottom: 8px; }
  .counts .badge { font-size: .9rem; padding: 2px 12px; }

  /* ---------- Reports ---------- */
  .day-title { margin: 18px 4px 8px; font-size: .95rem; font-weight: 700; color: var(--ink-soft); }

  .u-row {
    width: 100%; text-align: left;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent;
  }
  .u-row:last-child { border-bottom: 0; }
  .u-row:active { background: var(--surface-2); }
  .u-row b { display: block; }
  .u-row small { color: var(--ink-soft); }

  /* ---------- Students ---------- */
  .stu { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .roll { flex: 0 0 auto; min-width: 42px; height: 42px; padding: 0 6px; display: grid; place-items: center; border-radius: 12px; background: var(--brand-soft); color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; }
  .stu-info { flex: 1; min-width: 0; }
  .stu-info b { display: block; font-size: 1.05rem; overflow-wrap: anywhere; line-height: 1.3; }
  .stu-info .ab-meta a { text-decoration: none; }
  .stu-acts { display: flex; gap: 4px; }
  .stu-acts button { width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--ink-soft); }
  .stu-acts button:active { background: var(--surface-2); }
  .stu-acts .rm:active { background: var(--bad-soft); color: var(--bad); }

  /* ---------- Sheet / modal ---------- */
  .overlay { position: fixed; inset: 0; z-index: 40; display: none; align-items: flex-end; justify-content: center; background: rgba(8, 20, 26, .55); }
  .overlay.open { display: flex; }

  .sheet-panel {
    width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto;
    background: var(--surface); border-radius: 22px 22px 0 0;
    padding: 6px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    animation: rise .22s ease;
  }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0 8px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .sheet-head h3 { margin: 0; font-size: 1.2rem; }
  .sheet-head button { width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--surface-2); color: var(--ink); font-size: 1rem; }
  .sheet-sub { margin: 0 0 12px; color: var(--ink-soft); font-size: .95rem; }

  .form-field { margin-bottom: 14px; }
  .form-field .field-label { color: var(--ink); }
  .form-field .opt { color: var(--ink-soft); font-weight: 400; }
  .form-error { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-size: .92rem; }

  .modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(8, 20, 26, .6); }
  .modal.open { display: flex; }
  .modal-card { width: 100%; max-width: 380px; padding: 20px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .modal-card p { margin: 0 0 16px; font-size: 1.05rem; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions .btn { flex: 1; }

  .toast {

      var r = await query.range(from, from + size - 1);
      if (r.error) throw r.error;
      var rows = r.data || [];
      out = out.concat(rows);
      if (rows.length < size) break;
      from += size;
    }
    return out;
  }

          else break;

        res[st.id] = n;

    });
    return res;

  function batchSelect(value, onChange, withAll) {

  function contactLinks(st) {

  /* =====================================================================
     VIEW 1 — ওভারভিউ
     ===================================================================== */
  function viewOverview(main, token) {
    var date = S.ov.date;
    main.appendChild(band('ওভারভিউ', dateBar({ date: date, onChange: function (d) { S.ov.date = d; go(); } })));
    var body = h('div', { class: 'content' }, loader());
    main.appendChild(body);

    loadSessions(addDays(date, -STREAK_WINDOW_DAYS), date).then(function () {
      if (token !== S.rid) return;
      body.textContent = '';
      body.appendChild(overviewBody(date));
    }).catch(function (e) {
      if (token !== S.rid) return;
      body.textContent = '';
      body.appendChild(errorBox(e, function () { go(); }));
    });
  }

  function overviewBody(date) {
    var wrap = h('div');
    var isToday = date === S.today;
    var day = S.sessions.filter(function (s) { return s.session_date === date; });
    var totalActive = S.students.filter(function (s) { return s.is_active; }).length;

    var present = 0, absent = 0;
    day.forEach(function (s) {
      (s.present_ids || []).forEach(function (id) { if (isActive(id)) present++; });
      (s.absent_ids || []).forEach(function (id) { if (isActive(id)) absent++; });
    });
    var recorded = present + absent;
    var rate = recorded ? Math.round((present / recorded) * 100) : 0;
    var notHeld = Math.max(0, totalActive - recorded);

    var bar = h('div', { class: 'bar' + (recorded ? '' : ' idle') }, h('i'));
    var panel = h('section', { class: 'panel' },
      h('div', { class: 'nums' },
        h('div', { class: 'num' }, h('b', { text: String(totalActive) }), h('span', { text: 'মোট স্টুডেন্ট' })),
        h('div', { class: 'num good' }, h('b', { text: String(present) }), h('span', { text: 'উপস্থিত' })),
        h('div', { class: 'num bad' }, h('b', { text: String(absent) }), h('span', { text: 'অনুপস্থিত' }))),
      bar,
      h('div', { class: 'facts' },
        h('div', { class: 'fact' }, h('b', { text: day.length + '/' + S.batches.length }), h('span', { text: 'ব্যাচে ক্লাস হয়েছে' })),
        h('div', { class: 'fact' }, h('b', { text: recorded ? rate + '%' : '—' }), h('span', { text: 'উপস্থিতির হার' }))),
      notHeld && day.length ? h('p', { class: 'note', text: 'যেসব ব্যাচে ক্লাস হয়নি, তাদের ' + notHeld + ' জন স্টুডেন্ট উপস্থিত/অনুপস্থিত হিসাবের বাইরে।' }) : null);
    wrap.appendChild(panel);
    setTimeout(function () { if (bar.firstChild) bar.firstChild.style.width = (recorded ? rate : 0) + '%'; }, 30);

    wrap.appendChild(h('div', { class: 'h2', text: isToday ? 'আজকের ক্লাস' : 'এই দিনের ক্লাস' }));
    if (!day.length) {
      wrap.appendChild(h('div', { class: 'muted-box', text: 'এই দিনে কোনো ক্লাসের রিপোর্ট জমা হয়নি।' }));
    } else {
      var order = {};
      S.batches.forEach(function (b, i) { order[b.id] = i; });
      day.slice().sort(function (a, b) { return order[a.batch_id] - order[b.batch_id]; }).forEach(function (s) {
        wrap.appendChild(h('button', { type: 'button', class: 'cls', onclick: function () { openReportSheet(s); } },
          h('div', {}, h('b', { text: batchName(s.batch_id) }), h('small', { text: 'উস্তাজ: ' + s.ustaz_name })),
          h('div', { class: 'cnt' },
            h('span', { class: 'g', text: (s.present_ids || []).length + ' উপস্থিত' }),
            h('span', { class: 'r', text: (s.absent_ids || []).length + ' অনুপস্থিত' }))));
      });
      var heldIds = {};
      day.forEach(function (s) { heldIds[s.batch_id] = true; });
      var missing = S.batches.filter(function (b) { return !heldIds[b.id]; }).map(function (b) { return b.name; });
      if (missing.length) wrap.appendChild(h('div', { class: 'muted-box', text: 'ক্লাস হয়নি: ' + missing.join(', ') }));
    }

    var streaks = computeStreaks(date);
    var todayItems = [];
    day.forEach(function (s) {
      (s.absent_ids || []).forEach(function (id) {
        var st = S.stuMap[id];
        if (st && st.is_active) todayItems.push({ st: st, streak: streaks[id] || 1 });
      });
    });
    sortAbsent(todayItems);

    var longItems = [];
    S.students.forEach(function (st) {
      if (st.is_active && (streaks[st.id] || 0) >= ALERT_STREAK) longItems.push({ st: st, streak: streaks[st.id] });
    });
    sortAbsent(longItems);

    var hotToday = todayItems.filter(function (i) { return i.streak >= ALERT_STREAK; }).length;

    wrap.appendChild(h('div', { class: 'h2' }, 'অনুপস্থিতির তালিকা'));
    var seg = h('div', { class: 'seg', role: 'tablist' });
    var listBox = h('div');
    var modes = [
      { id: 'today', label: (isToday ? 'আজকের' : 'এই দিনের') + ' অনুপস্থিত (' + todayItems.length + ')' },
      { id: 'streak', label: 'টানা ' + ALERT_STREAK + '+ ক্লাস (' + longItems.length + ')' }
    ];

    function renderAbsent() {
      seg.textContent = '';
      modes.forEach(function (m) {
        seg.appendChild(h('button', {
          type: 'button', role: 'tab', 'aria-selected': S.ov.mode === m.id ? 'true' : 'false',
          class: S.ov.mode === m.id ? 'on' : '', text: m.label,
          onclick: function () { S.ov.mode = m.id; renderAbsent(); }
        }));
      });
      listBox.textContent = '';
      if (S.ov.mode === 'today') {
        if (!day.length) { listBox.appendChild(h('div', { class: 'muted-box', text: 'এই দিনে কোনো রিপোর্ট নেই, তাই অনুপস্থিতির তালিকাও নেই।' })); return; }
        if (!todayItems.length) { listBox.appendChild(h('div', { class: 'muted-box', text: 'এই দিনে কেউ অনুপস্থিত নেই।' })); return; }
        if (hotToday) {
          listBox.appendChild(h('div', { class: 'group-title red', text: 'টানা ' + ALERT_STREAK + ' বা তার বেশি ক্লাসে অনুপস্থিত (' + hotToday + ' জন)' }));
        }
        todayItems.forEach(function (it, idx) {
          if (hotToday && idx === hotToday) listBox.appendChild(h('div', { class: 'group-title', text: 'অন্যান্য অনুপস্থিত (' + (todayItems.length - hotToday) + ' জন)' }));
          listBox.appendChild(absentRow(it));
        });
      } else {
        listBox.appendChild(h('p', { class: 'note', text: 'যারা এখন পর্যন্ত টানা ' + ALERT_STREAK + ' বা তার বেশি ক্লাসে অনুপস্থিত, সব ব্যাচ মিলিয়ে। যে বেশি ক্লাসে অনুপস্থিত সে আগে।' }));
        if (!longItems.length) { listBox.appendChild(h('div', { class: 'muted-box', text: 'কেউ টানা ' + ALERT_STREAK + ' ক্লাসে অনুপস্থিত নেই।' })); return; }
        longItems.forEach(function (it) { listBox.appendChild(absentRow(it)); });
      }
    }
    renderAbsent();
    wrap.appendChild(seg);
    wrap.appendChild(listBox);
    return wrap;
  }

  function absentRow(it) {
    var st = it.st;
    var hot = it.streak >= ALERT_STREAK;
    var badge = it.streak >= ALERT_STREAK
      ? h('span', { class: 'badge red', text: 'টানা ' + it.streak + ' ক্লাস' })
      : it.streak === 2 ? h('span', { class: 'badge amber', text: 'টানা 2 ক্লাস' }) : null;
    return h('div', { class: 'ab' + (hot ? ' hot' : '') },
      h('div', { class: 'ab-main' },
        h('div', { class: 'ab-name', text: st.name }),
        h('div', { class: 'ab-meta' },
          h('span', { text: 'রোল ' + st.roll }),
          h('span', { text: batchName(st.batch_id) }),
          h('span', { text: st.phone }))),
      h('div', { class: 'ab-side' }, badge, h('div', { class: 'ab-actions' }, contactLinks(st))));
  }

  /* =====================================================================
     VIEW 2 — হাজিরা নিন
     ===================================================================== */
  function draftKey(b, d) { return 'att.draft.' + b + '.' + d; }

  function viewAttendance(main, token) {
    var A = S.att;
    if (!S.batches.length) {
      main.appendChild(band('হাজিরা'));
      main.appendChild(h('div', { class: 'content' }, h('div', { class: 'muted-box', text: 'কোনো ব্যাচ নেই। আগে "স্টুডেন্ট" ট্যাব থেকে ব্যাচ যুক্ত করুন।' })));
      return;
    }
    if (!batchById(A.batchId)) {
      var last = LS.get('att.batch');
      A.batchId = batchById(last) ? last : S.batches[0].id;
    }
    if (A.date > S.today) A.date = S.today;
    var ctxToken = 0;

    var bandEl = band('হাজিরা নিন',
      h('label', { class: 'field-label', text: 'ব্যাচ' }),
      batchSelect(A.batchId, function (v) { A.batchId = v; LS.set('att.batch', v); go(); }),
      dateBar({ date: A.date, onChange: function (d) { A.date = d; go(); } }));
    main.appendChild(bandEl);

    var ustazList = h('datalist', { id: 'ustazList' });
    var seen = {};
    S.sessions.forEach(function (s) { if (s.ustaz_name && !seen[s.ustaz_name]) { seen[s.ustaz_name] = true; ustazList.appendChild(h('option', { value: s.ustaz_name })); } });

    var ustazInput = h('input', {
      class: 'text-input', type: 'text', id: 'ustazName', maxlength: '60', autocomplete: 'off',
      placeholder: 'আপনার নাম লিখুন', list: 'ustazList',
      value: A.ustaz || LS.get('att.ustaz') || userDisplayName()
    });
    ustazInput.addEventListener('input', function () {
      A.ustaz = cleanText(ustazInput.value);
      LS.set('att.ustaz', A.ustaz);
      markDirty();
    });

    var statusEl = h('div');
    var listEl = h('div');
    var totalCountEl = h('span', { class: 'count', text: '0' });
    var resultEl = h('div');

    var card = h('section', { class: 'card', style: 'margin-top:16px' },
      h('div', { class: 'section' },
        h('label', { class: 'field-label', for: 'ustazName', text: 'উস্তাজের নাম' }),
        ustazInput, ustazList,
        h('p', { class: 'hint', text: 'নামটি এই ডিভাইসে সংরক্ষিত থাকবে, পরের বার আবার লিখতে হবে না।' })),
      h('div', { class: 'section' },
        h('div', { class: 'section-head' },
          h('h2', {}, 'নামের তালিকা', totalCountEl),
          h('div', { class: 'link-btns' },
            h('button', { type: 'button', class: 'link-btn', text: 'সবাই', onclick: function () { setAll(true); } }),
            h('button', { type: 'button', class: 'link-btn', text: 'বাতিল', onclick: function () { setAll(false); } }))),
        statusEl, listEl,
        h('button', { type: 'button', class: 'btn ghost block', style: 'margin-top:6px', onclick: function () {
          openStudentForm(A.batchId, null, function () { fillList(); fillResult(); });
        } }, ico('plus'), 'নতুন স্টুডেন্ট যুক্ত করুন')),
      h('div', { class: 'section' },
        h('div', { class: 'section-head' }, h('h2', { text: 'উপস্থিতদের তালিকা' })),
        resultEl));
    main.appendChild(h('div', { class: 'content' }, card));

    function activeStudents() { return studentsOf(A.batchId, true); }

    function presentNames() {
      return activeStudents().filter(function (s) { return A.ticked[s.id]; }).map(function (s) { return s.name; });
    }

    function saveDraft() {
      var ids = Object.keys(A.ticked).filter(function (k) { return A.ticked[k]; });
      LS.set(draftKey(A.batchId, A.date), JSON.stringify({ ticked: ids, ustaz: A.ustaz }));
    }

    function markDirty() {
      A.dirty = true;
      saveDraft();
      fillStatus();
    }

    function fillStatus() {
      statusEl.textContent = '';
      var cls, text;
      if (A.dirty) { cls = 'dirty'; text = 'পরিবর্তন এখনো জমা হয়নি। সংরক্ষণ করতে নিচে "জমা দিন" চাপুন।'; }
      else if (A.existing) { cls = 'ok'; text = 'এই তারিখের রিপোর্ট জমা আছে (শেষ আপডেট ' + fmtTime(A.existing.updated_at || A.existing.created_at) + ', উস্তাজ: ' + A.existing.ustaz_name + ')'; }
      else { cls = 'new'; text = 'এই তারিখের রিপোর্ট এখনো জমা হয়নি।'; }
      statusEl.appendChild(h('div', { class: 'status ' + cls, text: text }));
    }

    function setAll(v) {
      activeStudents().forEach(function (s) { if (v) A.ticked[s.id] = true; else delete A.ticked[s.id]; });
      markDirty();
      fillList();
      fillResult();
    }

    function fillList() {
      var students = activeStudents();
      totalCountEl.textContent = String(students.length);
      listEl.textContent = '';
      if (!students.length) {
        listEl.appendChild(h('div', { class: 'empty', text: 'এই ব্যাচে এখনো কোনো স্টুডেন্ট নেই। নিচের বাটন থেকে যুক্ত করুন।' }));
        return;
      }
      var ul = h('ul', { class: 'names' });
      students.forEach(function (st) {
        var row = h('li', { class: 'row' + (A.ticked[st.id] ? ' on' : '') });
        var input = h('input', { type: 'checkbox', checked: !!A.ticked[st.id] });
        input.addEventListener('change', function () {
          if (input.checked) A.ticked[st.id] = true; else delete A.ticked[st.id];
          row.classList.toggle('on', input.checked);
          markDirty();
          fillResult();
        });
        var box = h('span', { class: 'box' });
        box.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
        row.appendChild(h('label', { class: 'check' }, input, box,
          h('span', { class: 'nm', text: st.name }),
          h('span', { class: 'roll-tag', text: 'রোল ' + st.roll })));
        ul.appendChild(row);
      });
      listEl.appendChild(ul);
    }

    var submitBtn, copyBtn;

    function fillResult() {
      var names = presentNames();
      var total = activeStudents().length;
      resultEl.textContent = '';
      resultEl.appendChild(h('div', { class: 'counts' },
        h('span', { class: 'badge green', text: 'উপস্থিত ' + names.length }),
        h('span', { class: 'badge red', text: 'অনুপস্থিত ' + (total - names.length) })));

      if (names.length) {
        var ol = h('ol', { class: 'present' });
        names.forEach(function (n) { ol.appendChild(h('li', { text: n })); });
        resultEl.appendChild(ol);
      } else {
        resultEl.appendChild(h('div', { class: 'empty', text: 'এখনো কাউকে উপস্থিত করা হয়নি। উপরের তালিকা থেকে টিক দিন।' }));
      }

      submitBtn = h('button', { type: 'button', class: 'btn', disabled: !total, onclick: submit }, ico('save'), 'জমা দিন');
      copyBtn = h('button', { type: 'button', class: 'btn ghost', disabled: !names.length, onclick: function () {
        copyText(buildCopyText(A.date, cleanText(ustazInput.value), batchName(A.batchId), presentNames()));
      } }, ico('copy'), 'কপি করুন');
      resultEl.appendChild(h('div', { class: 'btn-row' }, submitBtn, copyBtn));
    }

    async function submit() {
      var students = activeStudents();
      var ustaz = cleanText(ustazInput.value);
      if (!students.length) { toast('এই ব্যাচে কোনো স্টুডেন্ট নেই', true); return; }
      if (!ustaz) { toast('আগে উস্তাজের নাম লিখুন', true); ustazInput.focus(); return; }
      if (A.date > S.today) { toast('ভবিষ্যতের তারিখে হাজিরা জমা দেওয়া যায় না', true); return; }

      var presentIds = [], absentIds = [];
      students.forEach(function (s) { (A.ticked[s.id] ? presentIds : absentIds).push(s.id); });

      if (!presentIds.length) {
        confirmBox('কেউ উপস্থিত নেই। তবুও রিপোর্ট জমা দেবেন?', 'হ্যাঁ, জমা দিন', function () { save(); });
      } else {
        save();
      }

      async function save() {
        submitBtn.disabled = true;
        submitBtn.lastChild.textContent = 'জমা হচ্ছে…';
        try {
          var row = {
            batch_id: A.batchId,
            session_date: A.date,
            ustaz_name: ustaz,
            present_ids: presentIds,
            absent_ids: absentIds,
            updated_at: new Date().toISOString()
          };
          var r = await sb.from('sessions').upsert(row, { onConflict: 'batch_id,session_date' }).select().single();
          if (r.error) throw r.error;
          upsertCachedSession(r.data);
          A.existing = r.data;
          A.ustaz = ustaz;
          A.dirty = false;
          LS.set('att.ustaz', ustaz);
          LS.del(draftKey(A.batchId, A.date));
          toast('রিপোর্ট জমা হয়েছে ✓');
        } catch (e) {
          toastError(e);
        }
        if (token !== S.rid) return;
        fillStatus();
        fillResult();
      }
    }

    async function loadContext() {
      var my = ++ctxToken;
      var b = A.batchId, d = A.date;
      listEl.textContent = '';
      listEl.appendChild(loader());
      resultEl.textContent = '';
      var existing = null;
      try {
        var r = await sb.from('sessions').select('*').eq('batch_id', b).eq('session_date', d).maybeSingle();
        if (r.error) throw r.error;
        existing = r.data || null;
      } catch (e) {
        if (my !== ctxToken || token !== S.rid) return;
        listEl.textContent = '';
        listEl.appendChild(errorBox(e, loadContext));
        return;
      }
      if (my !== ctxToken || token !== S.rid) return;

      A.existing = existing;
      A.ticked = {};
      A.dirty = false;
      var ustaz = (existing && existing.ustaz_name) || LS.get('att.ustaz') || userDisplayName();
      if (existing) (existing.present_ids || []).forEach(function (id) { A.ticked[id] = true; });

      var draft = null;
      try { draft = JSON.parse(LS.get(draftKey(b, d)) || 'null'); } catch (e) { draft = null; }
      if (draft && Array.isArray(draft.ticked)) {
        A.ticked = {};
        draft.ticked.forEach(function (id) { A.ticked[id] = true; });
        if (draft.ustaz) ustaz = draft.ustaz;
        A.dirty = true;
      }

      A.ustaz = ustaz;
      ustazInput.value = ustaz;
      fillStatus();
      fillList();
      fillResult();
    }

    loadContext();
  }

  /* =====================================================================
     VIEW 3 — রিপোর্ট
     ===================================================================== */
  function viewReports(main, token) {
    var R = S.rep;
    var seq = 0;

    var ustazSel = h('select', { class: 'sel', 'aria-label': 'উস্তাজ' });
    ustazSel.addEventListener('change', function () { R.ustaz = ustazSel.value; renderBody(); });
    var batchSel = batchSelect(R.batchId, function (v) { R.batchId = v; renderBody(); }, true);

    var fromIn = h('input', { type: 'date', class: 'date-input', 'aria-label': 'শুরুর তারিখ', value: R.from, max: S.today });
    var toIn = h('input', { type: 'date', class: 'date-input', 'aria-label': 'শেষ তারিখ', value: R.to, max: S.today });
    fromIn.addEventListener('change', function () { if (!fromIn.value) return; R.from = fromIn.value; if (R.from > R.to) R.to = R.from; syncRange(); refresh(); });
    toIn.addEventListener('change', function () { if (!toIn.value) return; R.to = toIn.value; if (R.to < R.from) R.from = R.to; syncRange(); refresh(); });

    var chipBox = h('div', { class: 'chips' });
    var presets = [
      { label: 'আজ', from: function () { return S.today; } },
      { label: '7 দিন', from: function () { return addDays(S.today, -6); } },
      { label: '30 দিন', from: function () { return addDays(S.today, -29); } },
      { label: 'এই মাস', from: function () { return monthStart(S.today); } }
    ];
    function renderChips() {
      chipBox.textContent = '';
      presets.forEach(function (p) {
        var on = R.from === p.from() && R.to === S.today;
        chipBox.appendChild(h('button', { type: 'button', class: 'chip' + (on ? ' on' : ''), text: p.label, onclick: function () {
          R.from = p.from(); R.to = S.today; syncRange(); refresh();
        } }));
      });
    }
    function syncRange() { fromIn.value = R.from; toIn.value = R.to; renderChips(); }

    main.appendChild(band('রিপোর্ট',
      h('div', { class: 'row-2', style: 'margin-top:0' },
        h('div', {}, h('label', { class: 'field-label', text: 'উস্তাজ' }), h('div', { class: 'select-wrap' }, ustazSel)),
        h('div', {}, h('label', { class: 'field-label', text: 'ব্যাচ' }), batchSel)),
      h('div', { class: 'row-2' },
        h('div', {}, h('label', { class: 'field-label', text: 'শুরু' }), fromIn),
        h('div', {}, h('label', { class: 'field-label', text: 'শেষ' }), toIn)),
      chipBox));
    renderChips();

    var body = h('div', { class: 'content' });
    main.appendChild(body);

    function fillUstaz() {
      var names = {};
      S.sessions.forEach(function (s) { if (s.ustaz_name) names[s.ustaz_name] = true; });
      if (R.ustaz) names[R.ustaz] = true;
      ustazSel.textContent = '';
      ustazSel.appendChild(h('option', { value: '', text: 'সব উস্তাজ' }));
      Object.keys(names).sort(function (a, b) { return a.localeCompare(b); }).forEach(function (n) {
        ustazSel.appendChild(h('option', { value: n, text: n }));
      });
      ustazSel.value = R.ustaz || '';
    }

    function filtered() {
      var order = {};
      S.batches.forEach(function (b, i) { order[b.id] = i; });
      return S.sessions.filter(function (s) {
        return s.session_date >= R.from && s.session_date <= R.to &&
          (!R.ustaz || s.ustaz_name === R.ustaz) &&
          (!R.batchId || s.batch_id === R.batchId);
      }).sort(function (a, b) {
        if (a.session_date !== b.session_date) return a.session_date < b.session_date ? 1 : -1;
        return (order[a.batch_id] || 0) - (order[b.batch_id] || 0);
      });
    }

    function renderBody() {
      body.textContent = '';
      var list = filtered();
      if (!list.length) {
        body.appendChild(h('div', { class: 'muted-box', text: 'এই ফিল্টারে কোনো রিপোর্ট পাওয়া যায়নি।' }));
        return;
      }
      var p = 0, a = 0;
      list.forEach(function (s) { p += (s.present_ids || []).length; a += (s.absent_ids || []).length; });
      var rate = (p + a) ? Math.round((p / (p + a)) * 100) : 0;

      body.appendChild(h('section', { class: 'panel' },
        h('div', { class: 'nums' },
          h('div', { class: 'num' }, h('b', { text: String(list.length) }), h('span', { text: 'ক্লাস' })),
          h('div', { class: 'num good' }, h('b', { text: String(p) }), h('span', { text: 'মোট উপস্থিতি' })),
          h('div', { class: 'num bad' }, h('b', { text: String(a) }), h('span', { text: 'মোট অনুপস্থিতি' }))),
        h('p', { class: 'note', text: 'গড় উপস্থিতির হার: ' + rate + '%' })));

      if (!R.ustaz) {
        var groups = {};
        list.forEach(function (s) {
          var g = groups[s.ustaz_name] || (groups[s.ustaz_name] = { name: s.ustaz_name, n: 0, p: 0, a: 0 });
          g.n++; g.p += (s.present_ids || []).length; g.a += (s.absent_ids || []).length;
        });
        var arr = Object.keys(groups).map(function (k) { return groups[k]; }).sort(function (x, y) { return y.n - x.n; });
        if (arr.length > 1) {
          body.appendChild(h('div', { class: 'h2', text: 'উস্তাজ অনুযায়ী' }));
          var uc = h('div', { class: 'card' });
          arr.forEach(function (g) {
            var r = (g.p + g.a) ? Math.round((g.p / (g.p + g.a)) * 100) : 0;
            uc.appendChild(h('button', { type: 'button', class: 'u-row', onclick: function () { R.ustaz = g.name; ustazSel.value = g.name; renderBody(); } },
              h('div', {}, h('b', { text: g.name }), h('small', { text: g.n + ' টি ক্লাস' })),
              h('span', { class: 'badge ' + (r >= 80 ? 'green' : r >= 60 ? 'amber' : 'red'), text: 'গড় ' + r + '%' })));
          });
          body.appendChild(uc);
        }
      }

      body.appendChild(h('div', { class: 'h2', text: 'রিপোর্টের তালিকা' }));
      var lastDate = '';
      list.forEach(function (s) {
        if (s.session_date !== lastDate) {
          lastDate = s.session_date;
          body.appendChild(h('div', { class: 'day-title', text: fmtDate(s.session_date) + '  ' + weekdayOf(s.session_date) }));
        }
        body.appendChild(h('button', { type: 'button', class: 'cls', onclick: function () { openReportSheet(s); } },
          h('div', {}, h('b', { text: batchName(s.batch_id) }), h('small', { text: 'উস্তাজ: ' + s.ustaz_name })),
          h('div', { class: 'cnt' },
            h('span', { class: 'g', text: (s.present_ids || []).length + ' উপস্থিত' }),
            h('span', { class: 'r', text: (s.absent_ids || []).length + ' অনুপস্থিত' }))));
      });
    }

    async function refresh() {
      var my = ++seq;
      body.textContent = '';
      body.appendChild(loader());
      try {
        await loadSessions(R.from, R.to);
      } catch (e) {
        if (my !== seq || token !== S.rid) return;
        body.textContent = '';
        body.appendChild(errorBox(e, refresh));
        return;
      }
      if (my !== seq || token !== S.rid) return;
      fillUstaz();
      renderBody();
    }

    fillUstaz();
    refresh();
  }

  function openReportSheet(sess) {
    var present = (sess.present_ids || []).map(function (id) { return S.stuMap[id]; }).filter(Boolean).sort(byRoll);
    var absent = (sess.absent_ids || []).map(function (id) { return S.stuMap[id]; }).filter(Boolean).sort(byRoll);
    var bName = batchName(sess.batch_id);

    var node = h('div', {},
      h('p', { class: 'sheet-sub', text: fmtDate(sess.session_date) + ' ' + weekdayOf(sess.session_date) + '   উস্তাজ: ' + sess.ustaz_name }),
      h('div', { class: 'counts' },
        h('span', { class: 'badge green', text: 'উপস্থিত ' + present.length }),
        h('span', { class: 'badge red', text: 'অনুপস্থিত ' + absent.length })));

      node.appendChild(ol);

      node.appendChild(h('div', { class: 'muted-box', text: 'কেউ উপস্থিত ছিল না।' }));

    node.appendChild(h('div', { class: 'group-title red', text: 'অনুপস্থিত' }));
    if (absent.length) {
      var ol2 = h('ol', { class: 'present absent' });
      absent.forEach(function (s) { ol2.appendChild(h('li', {}, s.name, h('span', { class: 'r', text: 'রোল ' + s.roll }))); });
      node.appendChild(ol2);
    } else {
      node.appendChild(h('div', { class: 'muted-box', text: 'কেউ অনুপস্থিত ছিল না।' }));
    }

    node.appendChild(h('div', { class: 'btn-row' },
      h('button', { type: 'button', class: 'btn', onclick: function () {
        copyText(buildCopyText(sess.session_date, sess.ustaz_name, bName, present.map(function (s) { return s.name; })));
      } }, ico('copy'), 'কপি করুন'),
      h('button', { type: 'button', class: 'btn ghost', onclick: function () {
        S.att.batchId = sess.batch_id;
        S.att.date = sess.session_date;
        closeSheet();
        go('attendance');
      } }, ico('edit'), 'সংশোধন')));

    node.appendChild(h('button', { type: 'button', class: 'btn ghost block', style: 'margin-top:10px;color:var(--bad)', onclick: function () {
      confirmBox('এই রিপোর্টটি মুছে ফেলবেন?', 'হ্যাঁ, মুছুন', async function () {
        try {
          var r = await sb.from('sessions').delete().eq('id', sess.id);
          if (r.error) throw r.error;
          S.sessions = S.sessions.filter(function (x) { return x.id !== sess.id; });
          closeSheet();
          toast('রিপোর্ট মুছে ফেলা হয়েছে');
          go();
        } catch (e) { toastError(e); }
      });
    } }, ico('trash'), 'রিপোর্ট মুছুন'));

    openSheet(bName, node);

  /* =====================================================================
     VIEW 4 — স্টুডেন্ট ও ব্যাচ
     ===================================================================== */
  function viewStudents(main, token) {
    var T = S.stu;
    if (!batchById(T.batchId)) T.batchId = S.batches.length ? S.batches[0].id : null;

    var formMode = 'add';
    var batchInput = h('input', { type: 'text', class: 'text-input', maxlength: '40', placeholder: 'ব্যাচের নাম', 'aria-label': 'ব্যাচের নাম' });
    var batchSubmit = h('button', { type: 'submit', text: 'যুক্ত করুন' });
    var batchForm = h('form', { class: 'inline-form', autocomplete: 'off' }, batchInput, batchSubmit);

    function openBatchForm(mode) {
      if (mode === 'rename' && !T.batchId) return;
      if (batchForm.classList.contains('open') && formMode === mode) { batchForm.classList.remove('open'); return; }
      formMode = mode;
      batchInput.value = mode === 'rename' ? batchName(T.batchId) : '';
      batchInput.placeholder = mode === 'rename' ? 'নতুন নাম' : 'ব্যাচের নাম';
      batchSubmit.textContent = mode === 'rename' ? 'সংরক্ষণ' : 'যুক্ত করুন';
      batchForm.classList.add('open');
      batchInput.focus();
      if (mode === 'rename') batchInput.select();
    }

    batchForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      var name = cleanText(batchInput.value);
      if (!name) { toast('ব্যাচের নাম লিখুন', true); return; }
      var dup = S.batches.some(function (b) { return b.name.toLowerCase() === name.toLowerCase() && !(formMode === 'rename' && b.id === T.batchId); });
      if (dup) { toast('এই নামে আগেই একটি ব্যাচ আছে', true); return; }
      batchSubmit.disabled = true;
      try {
        if (formMode === 'rename') {
          var r1 = await sb.from('batches').update({ name: name }).eq('id', T.batchId).select().single();
          if (r1.error) throw r1.error;
          batchById(T.batchId).name = r1.data.name;
          toast('ব্যাচের নাম বদলানো হয়েছে');
        } else {
          var r2 = await sb.from('batches').insert({ name: name }).select().single();
          if (r2.error) throw r2.error;
          S.batches.push(r2.data);
          T.batchId = r2.data.id;
          toast('নতুন ব্যাচ যুক্ত হয়েছে');
        }
        if (token === S.rid) go();
      } catch (err) {
        toastError(err, 'এই নামে আগেই একটি ব্যাচ আছে');
      }
      batchSubmit.disabled = false;
    });

    function deleteBatch() {
      var b = batchById(T.batchId);
      if (!b) return;
      confirmBox('"' + b.name + '" ব্যাচ, এর সব স্টুডেন্ট ও সব রিপোর্ট চিরতরে মুছে যাবে। নিশ্চিত?', 'হ্যাঁ, মুছুন', async function () {
        try {
          var r = await sb.from('batches').delete().eq('id', b.id);
          if (r.error) throw r.error;
          S.batches = S.batches.filter(function (x) { return x.id !== b.id; });
          S.students = S.students.filter(function (x) { return x.batch_id !== b.id; });
          S.sessions = S.sessions.filter(function (x) { return x.batch_id !== b.id; });
          rebuildIndex();
          T.batchId = S.batches.length ? S.batches[0].id : null;
          if (S.att.batchId === b.id) S.att.batchId = null;
          if (S.rep.batchId === b.id) S.rep.batchId = '';
          toast('ব্যাচ মুছে ফেলা হয়েছে');
          go();
        } catch (e) { toastError(e); }
      });
    }

    main.appendChild(band('স্টুডেন্ট ও ব্যাচ',
      h('label', { class: 'field-label', text: 'ব্যাচ' }),
      h('div', { class: 'tools' },
        S.batches.length ? batchSelect(T.batchId, function (v) { T.batchId = v; T.q = ''; go(); }) : h('div', { class: 'select-wrap', style: 'flex:1;align-self:center;color:var(--band-soft)', text: 'কোনো ব্যাচ নেই' }),
        h('button', { type: 'button', class: 'tool-btn', title: 'নতুন ব্যাচ', 'aria-label': 'নতুন ব্যাচ যুক্ত করুন', onclick: function () { openBatchForm('add'); } }, ico('plus')),
        h('button', { type: 'button', class: 'tool-btn', title: 'ব্যাচের নাম বদলান', 'aria-label': 'ব্যাচের নাম পরিবর্তন করুন', disabled: !T.batchId, onclick: function () { openBatchForm('rename'); } }, ico('edit')),
        h('button', { type: 'button', class: 'tool-btn', title: 'ব্যাচ মুছুন', 'aria-label': 'ব্যাচ মুছে ফেলুন', disabled: !T.batchId, onclick: deleteBatch }, ico('trash'))),
      batchForm));

    var content = h('div', { class: 'content' });
    main.appendChild(content);

    if (!T.batchId) {
      content.appendChild(h('div', { class: 'muted-box', style: 'margin-top:4px', text: 'শুরু করতে উপরের + বাটন থেকে একটি ব্যাচ যুক্ত করুন।' }));
      return;
    }

    var listBox = h('div');
    var countEl = h('span', { class: 'count', text: '0' });
    var search = h('input', { type: 'search', class: 'text-input', placeholder: 'নাম, রোল বা ফোন দিয়ে খুঁজুন', 'aria-label': 'স্টুডেন্ট খুঁজুন', value: T.q });
    search.addEventListener('input', function () { T.q = search.value; renderList(); });

    content.appendChild(h('div', { class: 'h2' }, h('span', {}, 'স্টুডেন্ট তালিকা', countEl),
      h('button', { type: 'button', class: 'btn small', onclick: function () { openStudentForm(T.batchId, null, renderList); } }, ico('plus'), 'নতুন স্টুডেন্ট')));
    content.appendChild(h('div', { style: 'margin-bottom:12px' }, search));
    content.appendChild(listBox);

    function renderList() {
      var all = studentsOf(T.batchId, true);
      countEl.textContent = String(all.length);
      var q = enDigits(T.q).toLowerCase().trim();
      var list = q ? all.filter(function (s) {
        return s.name.toLowerCase().indexOf(q) !== -1 || String(s.roll).toLowerCase().indexOf(q) !== -1 || String(s.phone).indexOf(q) !== -1;
      }) : all;
      listBox.textContent = '';
      if (!all.length) { listBox.appendChild(h('div', { class: 'empty', text: 'এই ব্যাচে এখনো কোনো স্টুডেন্ট নেই। উপরের বাটন থেকে যুক্ত করুন।' })); return; }
      if (!list.length) { listBox.appendChild(h('div', { class: 'empty', text: 'কোনো স্টুডেন্ট পাওয়া যায়নি।' })); return; }

      list.forEach(function (st) {
        var meta = h('div', { class: 'ab-meta' },
          h('a', { href: 'tel:' + cleanPhone(st.phone), text: 'ফোন: ' + st.phone }));
        if (st.whatsapp) meta.appendChild(h('a', { href: 'https://wa.me/' + waDigits(st.whatsapp), target: '_blank', rel: 'noopener', text: 'WhatsApp: ' + st.whatsapp }));

        listBox.appendChild(h('div', { class: 'stu' },
          h('div', { class: 'roll', text: String(st.roll), title: 'রোল নম্বর' }),
          h('div', { class: 'stu-info' }, h('b', { text: st.name }), meta),
          h('div', { class: 'stu-acts' },
            h('button', { type: 'button', 'aria-label': st.name + ' সম্পাদনা', title: 'সম্পাদনা', onclick: function () { openStudentForm(T.batchId, st, renderList); } }, ico('edit')),
            h('button', { type: 'button', class: 'rm', 'aria-label': st.name + ' সরিয়ে ফেলুন', title: 'সরিয়ে ফেলুন', onclick: function () { removeStudent(st, renderList); } }, ico('trash')))));
      });
    }

    renderList();
  }

  function removeStudent(st, after) {
    confirmBox('"' + st.name + '" কে তালিকা থেকে সরিয়ে ফেলবেন? আগের রিপোর্টে তার তথ্য থেকে যাবে।', 'হ্যাঁ, সরান', async function () {
      try {
        var r = await sb.from('students').update({ is_active: false }).eq('id', st.id).select().single();
        if (r.error) throw r.error;
        st.is_active = false;
        toast('স্টুডেন্ট সরানো হয়েছে');
        if (after) after();
      } catch (e) { toastError(e); }
    });
  }

      h('div', { class: 'form-field' }, h('label', { class: 'field-label', text: 'নাম' }), nameIn),
      h('div', { class: 'form-field' }, h('label', { class: 'field-label', text: 'রোল নম্বর' }), rollIn),
      h('div', { class: 'form-field' }, h('label', { class: 'field-label', text: 'ফোন নম্বর' }), phoneIn),
      h('div', { class: 'form-field' }, h('label', { class: 'field-label' }, 'হোয়াটসঅ্যাপ নম্বর ', h('span', { class: 'opt', text: '(ঐচ্ছিক)' })), waIn),
      saveBtn);

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errBox.hidden = true;

      var name = cleanText(nameIn.value);
      var roll = cleanText(enDigits(rollIn.value));
      var phone = cleanPhone(phoneIn.value);
      var wa = cleanPhone(waIn.value);

      if (!name) return fail('স্টুডেন্টের নাম লিখুন', nameIn);
      if (!roll) return fail('রোল নম্বর লিখুন', rollIn);
      var clash = S.students.some(function (s) {
        return s.batch_id === batchId && s.is_active && String(s.roll).toLowerCase() === roll.toLowerCase() && (!student || s.id !== student.id);
      });
      if (clash) return fail('এই ব্যাচে রোল ' + roll + ' আগে থেকেই আছে', rollIn);
      if (!phone) return fail('ফোন নম্বর লিখুন', phoneIn);
      if (!validPhone(phone)) return fail('ফোন নম্বর সঠিক নয় (কমপক্ষে 10 ডিজিট)', phoneIn);
      if (wa && !validPhone(wa)) return fail('হোয়াটসঅ্যাপ নম্বর সঠিক নয়', waIn);

      saveBtn.disabled = true;
      var payload = { name: name, roll: roll, phone: phone, whatsapp: wa || null };
      try {
        var r;
        if (isEdit) {
          r = await sb.from('students').update(payload).eq('id', student.id).select().single();
          if (r.error) throw r.error;
          S.students = S.students.map(function (s) { return s.id === student.id ? r.data : s; });
        } else {
          payload.batch_id = batchId;
          r = await sb.from('students').insert(payload).select().single();
          if (r.error) throw r.error;
          S.students.push(r.data);
        }
        rebuildIndex();
        closeSheet();
        toast(isEdit ? 'তথ্য সংরক্ষণ হয়েছে ✓' : 'স্টুডেন্ট যুক্ত হয়েছে ✓');
        if (onSaved) onSaved();
      } catch (err) {
        fail(errText(err, 'এই রোল নম্বর এই ব্যাচে আগে থেকেই আছে'));
        saveBtn.disabled = false;
      }
    });

    openSheet(isEdit ? 'স্টুডেন্টের তথ্য বদলান' : 'নতুন স্টুডেন্ট', form);
  }

  /* =====================================================================
     Shell, navigation
     ===================================================================== */
  var TABS = [
    { id: 'overview', label: 'ওভারভিউ', icon: 'home' },
    { id: 'attendance', label: 'হাজিরা', icon: 'tick' },
    { id: 'reports', label: 'রিপোর্ট', icon: 'file' },
    { id: 'students', label: 'স্টুডেন্ট', icon: 'users' }
  ];
  var VIEWS = { overview: viewOverview, attendance: viewAttendance, reports: viewReports, students: viewStudents };

  function renderShell() {
    var app = $('app');
    app.textContent = '';
    var uname = userDisplayName();
    var brandText = h('div', { class: 'brand-text' },
      h('span', { text: 'উপস্থিতি খাতা' }),
      uname ? h('small', { class: 'brand-sub', text: 'স্বাগতম, ' + uname }) : null);
    app.appendChild(h('header', { class: 'topbar' },
      h('div', { class: 'brand' }, h('span', { class: 'logo' }, ico('book')), brandText),
      h('button', { type: 'button', class: 'icon-btn light', title: uname ? 'লগআউট — ' + uname : 'লগআউট', 'aria-label': 'লগআউট', onclick: logout }, ico('logout'))));
    app.appendChild(h('main', { id: 'main', class: 'wrap' }));

    var inner = h('div', { class: 'in' });
    TABS.forEach(function (t) {
      inner.appendChild(h('button', { type: 'button', class: 'tab', 'data-tab': t.id, onclick: function () { go(t.id); } }, ico(t.icon), t.label));
    });
    app.appendChild(h('nav', { class: 'tabbar', 'aria-label': 'প্রধান মেনু' }, inner));
  }

  function updateNav() {
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      var on = tabs[i].getAttribute('data-tab') === S.view;
      tabs[i].classList.toggle('on', on);
      if (on) tabs[i].setAttribute('aria-current', 'page'); else tabs[i].removeAttribute('aria-current');
    }
  }

  function go(view) {
    if (view) S.view = view;
    S.rid++;
    closeSheet();
    closeConfirm();
    updateNav();
    var main = $('main');
    if (!main) return;
    main.textContent = '';
    window.scrollTo(0, 0);
    VIEWS[S.view](main, S.rid);
  }

  /* ---------- Auth screens ---------- */
  function authShell(title, sub, body) {
    var app = $('app');
    app.textContent = '';
    app.appendChild(h('div', { class: 'auth' },
      h('div', { class: 'auth-card' },
        h('div', { class: 'auth-head' }, h('span', { class: 'logo' }, ico('book')), h('h1', { text: title }), h('p', { text: sub })),
        h('div', { class: 'auth-body' }, body))));
  }

  function renderFatal(msg) {
    authShell('উপস্থিতি খাতা', 'সমস্যা হয়েছে', [
      h('div', { class: 'errbox' }, h('p', { text: msg }),
        h('button', { type: 'button', class: 'btn ghost small', text: 'পেজ রিফ্রেশ করুন', onclick: function () { window.location.reload(); } }))
    ]);
  }

  function renderSetup(msg) {
    var errBox = h('p', { class: 'form-error', hidden: !msg ? '' : null, text: msg || '' });
    if (msg) errBox.hidden = false;
    var urlIn = h('input', { class: 'text-input', type: 'url', placeholder: 'https://xxxxxxxx.supabase.co', autocomplete: 'off' });
    var keyIn = h('input', { class: 'text-input', type: 'text', placeholder: 'anon / publishable key', autocomplete: 'off' });
    var form = h('form', { autocomplete: 'off' },
      h('ol', {},
        h('li', { text: 'Supabase-এ প্রজেক্ট খুলুন এবং SQL Editor-এ supabase-schema.sql চালান।' }),
        h('li', { text: 'Authentication → Providers → Email চালু আছে কি না নিশ্চিত করুন।' }),
        h('li', { text: 'Project Settings → API থেকে URL ও anon key কপি করুন।' })),
      errBox,
      h('div', { class: 'form-field' }, h('label', { class: 'field-label', text: 'Project URL' }), urlIn),
      h('div', { class: 'form-field' }, h('label', { class: 'field-label', text: 'anon / publishable key' }), keyIn),
      h('button', { type: 'submit', class: 'btn', text: 'সংরক্ষণ করে শুরু করুন' }),
      h('p', { class: 'hint', text: 'স্থায়ীভাবে ব্যবহার করতে এই দুটি মান ফাইলের উপরের CONFIG অংশে বসিয়ে দিন।' }));
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var url = cleanText(urlIn.value).replace(/\/+$/, '');
      var key = cleanText(keyIn.value);
      if (!/^https?:\/\/.+/i.test(url)) { errBox.textContent = 'সঠিক Project URL দিন'; errBox.hidden = false; return; }
      if (key.length < 20) { errBox.textContent = 'সঠিক key দিন'; errBox.hidden = false; return; }
      LS.set('att.cfg', JSON.stringify({ url: url, key: key }));
      boot();
    });
    authShell('সেটআপ', 'Supabase সংযোগ দিন', form);
  }

  /* ---------- Login ---------- */
  function renderLogin(msg) {
    var errBox = h('p', { class: 'form-error', hidden: '' });
    if (msg) { errBox.textContent = msg; errBox.hidden = false; }
    var email = h('input', { class: 'text-input', type: 'email', autocomplete: 'username', placeholder: 'ইমেইল', inputmode: 'email' });
    var pass = h('input', { class: 'text-input', type: 'password', autocomplete: 'current-password', placeholder: 'পাসওয়ার্ড' });
    var btn = h('button', { type: 'submit', class: 'btn', text: 'লগইন' });
    var form = h('form', {},
      errBox,
      h('div', { class: 'form-field' }, h('label', { class: 'field-label', text: 'ইমেইল' }), email),
      h('div', { class: 'form-field' }, h('label', { class: 'field-label', text: 'পাসওয়ার্ড' }), pass),
      btn);

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errBox.hidden = true;
      var em = cleanText(email.value);
      if (!em || !pass.value) { errBox.textContent = 'ইমেইল ও পাসওয়ার্ড দিন'; errBox.hidden = false; return; }
      btn.disabled = true;
      btn.textContent = 'লগইন হচ্ছে…';
      try {
        var r = await sb.auth.signInWithPassword({ email: em, password: pass.value });
        if (r.error) throw r.error;
        S.user = r.data.user || (r.data.session && r.data.session.user) || { email: em };
        await startApp();
        return;
      } catch (err) {
        var m = (err && err.message) || '';
        if (/invalid login/i.test(m)) errBox.textContent = 'ইমেইল বা পাসওয়ার্ড ভুল';
        else if (/email.*not.*confirmed/i.test(m)) errBox.textContent = 'ইমেইল এখনো যাচাই করা হয়নি। ইনবক্সের লিংকে ক্লিক করুন।';
        else errBox.textContent = errText(err);
        errBox.hidden = false;
      }
      btn.disabled = false;
      btn.textContent = 'লগইন';
    });

    var extra = [form,
      h('a', { class: 'text-link', href: '#', text: 'নতুন উস্তাজ? রেজিস্ট্রেশন করুন', onclick: function (e) { e.preventDefault(); renderRegister(); } })
    ];
    if (!CONFIG.url && LS.get('att.cfg')) {
      extra.push(h('a', { class: 'text-link muted', href: '#', text: 'Supabase সেটিং বদলান', onclick: function (e) { e.preventDefault(); LS.del('att.cfg'); window.location.reload(); } }));
    }
    authShell('উপস্থিতি খাতা', 'চালিয়ে যেতে লগইন করুন', extra);
  }

  /* ---------- Register (নতুন উস্তাজের জন্য) ---------- */
  function renderRegister(msg) {
    var errBox = h('p', { class: 'form-error', hidden: '' });
    if (msg) { errBox.textContent = msg; errBox.hidden = false; }

    var nameIn = h('input', { class: 'text-input', type: 'text', maxlength: '60', autocomplete: 'name', placeholder: 'আপনার পূর্ণ নাম' });
    var email = h('input', { class: 'text-input', type: 'email', autocomplete: 'email', placeholder: 'ইমেইল', inputmode: 'email' });
    var pass = h('input', { class: 'text-input', type: 'password', autocomplete: 'new-password', placeholder: 'পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)' });
    var pass2 = h('input', { class: 'text-input', type: 'password', autocomplete: 'new-password', placeholder: 'আবার পাসওয়ার্ড লিখুন' });
    var btn = h('button', { type: 'submit', class: 'btn', text: 'রেজিস্ট্রেশন করুন' });

    var form = h('form', {},
      errBox,
      h('div', { class: 'form-field' }, h('label', { class: 'field-label' }, 'আপনার নাম ', h('span', { class: 'opt', text: '(উস্তাজ হিসেবে দেখানো হবে)' })), nameIn),
      h('div', { class: 'form-field' }, h('label', { class: 'field-label', text: 'ইমেইল' }), email),
      h('div', { class: 'form-field' }, h('label', { class: 'field-label', text: 'পাসওয়ার্ড' }), pass),
      h('div', { class: 'form-field' }, h('label', { class: 'field-label', text: 'পাসওয়ার্ড নিশ্চিত করুন' }), pass2),
      btn);

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errBox.hidden = true;
      var nm = cleanText(nameIn.value);
      var em = cleanText(email.value).toLowerCase();
      var pw = pass.value || '';

      if (!nm) { errBox.textContent = 'আপনার নাম লিখুন'; errBox.hidden = false; nameIn.focus(); return; }
      if (!em || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { errBox.textContent = 'সঠিক ইমেইল দিন'; errBox.hidden = false; email.focus(); return; }
      if (pw.length < 6) { errBox.textContent = 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে'; errBox.hidden = false; pass.focus(); return; }
      if (pw !== pass2.value) { errBox.textContent = 'দুটি পাসওয়ার্ড মিলছে না'; errBox.hidden = false; pass2.focus(); return; }

      btn.disabled = true;
      btn.textContent = 'রেজিস্ট্রেশন হচ্ছে…';
      try {
        var r = await sb.auth.signUp({
          email: em,
          password: pw,
          options: { data: { full_name: nm } }
        });
        if (r.error) throw r.error;

        // ইমেইল আগেই রেজিস্টার্ড হলে Supabase identities খালি পাঠায়
        var u = r.data && r.data.user;
        if (u && Array.isArray(u.identities) && u.identities.length === 0 && !(r.data && r.data.session)) {
          errBox.textContent = 'এই ইমেইল দিয়ে আগেই রেজিস্ট্রেশন করা আছে। লগইন করুন।';
          errBox.hidden = false;
          btn.disabled = false;
          btn.textContent = 'রেজিস্ট্রেশন করুন';
          return;
        }

        // Confirm email বন্ধ থাকলে সাথে সাথেই সেশন চলে আসে
        if (r.data && r.data.session) {
          S.user = r.data.session.user || u;
          LS.set('att.ustaz', nm);
          await startApp();
          return;
        }

        // Confirm email চালু থাকলে লিংক-যাচাইয়ের বার্তা
        authShell('রেজিস্ট্রেশন সফল', 'ইমেইল যাচাই করুন', [
          h('p', { class: 'hint', text: 'আমরা ' + em + ' ঠিকানায় একটি যাচাইকরণ লিংক পাঠিয়েছি। ইনবক্সে (কিংবা স্প্যাম ফোল্ডারে) লিংকটি খুঁজে ক্লিক করে তারপর লগইন করুন।' }),
          h('button', { type: 'button', class: 'btn block', text: 'লগইন স্ক্রিনে ফিরে যান', onclick: function () { renderLogin(); } })
        ]);
        return;
      } catch (err) {
        var m = (err && err.message) || '';
        if (/already registered|already exists|user already/i.test(m)) errBox.textContent = 'এই ইমেইল দিয়ে আগেই রেজিস্ট্রেশন করা আছে। লগইন করুন।';
        else if (/password.*short|weak password/i.test(m)) errBox.textContent = 'পাসওয়ার্ড আরেকটু শক্তিশালী দিন';
        else errBox.textContent = errText(err);
        errBox.hidden = false;
      }
      btn.disabled = false;
      btn.textContent = 'রেজিস্ট্রেশন করুন';
    });

    var extra = [form,
      h('a', { class: 'text-link', href: '#', text: 'আগেই অ্যাকাউন্ট আছে? লগইন করুন', onclick: function (e) { e.preventDefault(); renderLogin(); } })
    ];
    authShell('নতুন উস্তাজ রেজিস্ট্রেশন', 'অ্যাকাউন্ট খুলে হাজিরা খাতা ব্যবহার শুরু করুন', extra);
  }

  async function logout() {
    try { await sb.auth.signOut(); } catch (e) { /* ignore */ }
    S.user = null;
    S.sessions = [];
    S.students = [];
    S.batches = [];
    renderLogin();
  }

  async function startApp() {
    authShell('উপস্থিতি খাতা', 'ডেটা লোড হচ্ছে…', [loader()]);
    try {
      await loadCore();
    } catch (e) {
      authShell('উপস্থিতি খাতা', 'ডেটা আনা যায়নি', [errorBox(e, startApp),
        h('a', { class: 'text-link', href: '#', text: 'লগআউট', onclick: function (ev) { ev.preventDefault(); logout(); } })]);
      return;
    }
    renderShell();
    go('overview');
  }

  function getConfig() {
    if (CONFIG.url && CONFIG.key) return { url: CONFIG.url, key: CONFIG.key };
    var raw = LS.get('att.cfg');
    if (raw) {
      try {
        var c = JSON.parse(raw);
        if (c && c.url && c.key) return c;
      } catch (e) { /* ignore */ }
    }
    return null;
  }

  async function boot() {
    var cfg = getConfig();
    if (!cfg) { renderSetup(); return; }
    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      renderFatal('Supabase লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ দেখে পেজ রিফ্রেশ করুন।');
      return;
    }
    try {
      sb = window.supabase.createClient(cfg.url, cfg.key);
    } catch (e) {
      LS.del('att.cfg');
      renderSetup('URL বা key সঠিক নয়, আবার দিন।');
      return;
    }

    sb.auth.onAuthStateChange(function (event) {
      if (event === 'SIGNED_OUT' && S.user) {
        S.user = null;
        renderLogin('আবার লগইন করুন');
      }
    });

    try {
      var r = await sb.auth.getSession();
      S.user = r && r.data && r.data.session ? r.data.session.user : null;
    } catch (e) {
      S.user = null;
    }

    if (S.user) await startApp(); else renderLogin();
  }

  /* ---------- দিন বদলালে তারিখ নিজে থেকে হালনাগাদ ---------- */
  function checkDayRollover() {
    var now = todayYmd();
    if (now === S.today) return;
    var old = S.today;
    S.today = now;
    if (S.ov.date === old) S.ov.date = now;
    if (S.att.date === old) S.att.date = now;
    if (S.rep.to === old) S.rep.to = now;
    if (S.user && $('main')) go();
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkDayRollover(); });
  window.addEventListener('focus', checkDayRollover);
  setInterval(checkDayRollover, 60000);

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if ($('confirmHost').classList.contains('open')) closeConfirm();
    else closeSheet();
  });

  $('sheetHost').addEventListener('click', function (e) { if (e.target === $('sheetHost')) closeSheet(); });
  $('confirmHost').addEventListener('click', function (e) { if (e.target === $('confirmHost')) closeConfirm(); });

  boot();
})();
</script>
</body>
